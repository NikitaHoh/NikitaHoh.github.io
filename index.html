<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список покупок — Хакатон</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bought-item {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .list-group-item {
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <h1 class="text-center mb-4">Список покупок</h1>
                
                <div class="card mb-4 shadow-sm">
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-md-7">
                                <input type="text" id="productName" class="form-control" placeholder="Название товара">
                            </div>
                            <div class="col-md-3">
                                <input type="number" id="productQuantity" class="form-control" placeholder="Кол-во" value="1">
                            </div>
                            <div class="col-md-2">
                                <button id="addBtn" class="btn btn-primary w-99">Добавить</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="btn-group w-100 mb-3" role="group">
                    <button id="filterAll" class="btn btn-outline-secondary active">Все</button>
                    <button id="filterActive" class="btn btn-outline-secondary">Активные</button>
                    <button id="filterBought" class="btn btn-outline-secondary">Купленные</button>
                </div>
                
                <div class="card shadow-sm">
                    <div class="card-body p-0" id="todoList">
                        <div class="text-muted text-center p-3">Товары появятся здесь</div>
                    </div>
                </div>
                
                <button id="clearBoughtBtn" class="btn btn-danger w-100 mt-3">Очистить купленные</button>
                
            </div>
        </div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
